<script>
/** ===== PFV: Sync global de filtros (Ger/Coord/Vend/Cat) ===== **/
const PFV_FILTERS_KEY = "pfv_filters_v2";
function pfvGetFilters(){try{return JSON.parse(localStorage.getItem(PFV_FILTERS_KEY)||"{}");}catch(e){return {};}}
function pfvSetFilters(patch){const cur=pfvGetFilters();const next={...cur,...patch};try{localStorage.setItem(PFV_FILTERS_KEY,JSON.stringify(next));}catch(e){}return next;}
function pfvTrySetValue(el,value,allowCreate=false){ if(!el||value==null||value==='') return false; if(el.tagName==='SELECT'){ const values=Array.isArray(value)?value.map(String):String(value).split(',').map(v=>v.trim()).filter(Boolean); const missing=values.filter(v=>!Array.from(el.options).some(o=>o.value===v)); if(missing.length){ if(!allowCreate) return false; missing.forEach(v=>{const opt=document.createElement('option');opt.value=v;opt.textContent=v;el.appendChild(opt);}); } Array.from(el.options).forEach(o=>o.selected=values.includes(o.value)); return true; } el.value=value; return true; }
function pfvBindFilterSync(map){
  const entries = Object.entries(map)
    .map(([key, cfg]) => {
      const id = typeof cfg === "string" ? cfg : cfg.id;
      const allowCreate = typeof cfg === "object" ? !!cfg.allowCreate : false;
      const el = document.getElementById(id);
      return el ? { key, el, allowCreate } : null;
    })
    .filter(Boolean);
  function applyFromStorage(){
    const saved = pfvGetFilters();
    entries.forEach(({key, el, allowCreate}) => {
      if(saved[key] != null && saved[key] !== "") pfvTrySetValue(el, saved[key], allowCreate);
    });
    if(typeof syncMultiSelectUI==='function') document.querySelectorAll('select[multiple]').forEach(syncMultiSelectUI);
  }
  function saveToStorage(){
    const patch = {};
    entries.forEach(({key,el})=>patch[key]=el.multiple?Array.from(el.selectedOptions).map(o=>o.value).filter(Boolean):(el.value||''));
    pfvSetFilters(patch);
  }
  entries.forEach(({el}) => {
    el.addEventListener("change", saveToStorage);
    el.addEventListener("input", saveToStorage);
  });
  window.addEventListener("storage", (e) => {
    if(e.key === PFV_FILTERS_KEY) applyFromStorage();
  });
  return { applyFromStorage, saveToStorage };
}
</script>

<script>
(function(){
  const nav = document.getElementById('navbar');
  const toggle = document.getElementById('navToggle');
  if(!nav || !toggle) return;
  if(toggle.__navBound) return;
  toggle.__navBound = true;
  function setOpen(open){
    nav.classList.toggle('active', open);
    nav.style.display = open ? 'flex' : '';
  }
  function onToggle(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    setOpen(!nav.classList.contains('active'));
  }
  toggle.addEventListener('click', onToggle, true);
  toggle.addEventListener('touchend', onToggle, {passive:false, capture:true});
  document.addEventListener('click', function(e){
    if(e && (e.target===toggle || toggle.contains(e.target))) return;
    if(nav.classList.contains('active')) setOpen(false);
  }, true);
  nav.addEventListener('click', function(e){ e.stopPropagation(); }, true);
})();
</script>

<script>
let DATA=[];
const norm = s => String(s ?? '').trim();
const up = s => norm(s).toUpperCase();
const num = v => {
 const raw = String(v ?? '').trim();
 if(raw === '') return 0;
 if(typeof v === 'number') return isNaN(v) ? 0 : v;
 let s = raw.replace(/\s| /g,'');
 const lastComma = s.lastIndexOf(',');
 const lastDot = s.lastIndexOf('.');
 if(lastComma>=0 && lastDot>=0){
   if(lastComma>lastDot){ s = s.replace(/\./g,'').replace(',', '.'); }
   else { s = s.replace(/,/g,''); }
 } else if(lastComma>=0){
   s = s.replace(',', '.');
 }
 const n = Number(s);
 return isNaN(n) ? 0 : n;
};
const money = v => (Number(v || 0)).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function normName(k){ return String(k||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\_\s]+/g,'').toUpperCase(); }
function getField(row, ...cands){ const keys=Object.keys(row||{}); const map=new Map(keys.map(k=>[normName(k),k])); for(const c of cands){ const nk=normName(c); if(map.has(nk)) return row[map.get(nk)]; } return undefined; }
function uniqSorted(a){ return [...new Set(a.filter(v=>v!=null && String(v).trim()!==''))].sort((a,b)=>(''+a).localeCompare((''+b),'pt-BR')); }
function fillSel(id,values){ const el=document.getElementById(id); if(!el)return; const cur=el.multiple?Array.from(el.selectedOptions).map(o=>o.value).filter(Boolean):[]; el.innerHTML='<option value="">Todos</option>'; uniqSorted(values).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;o.selected=cur.includes(String(v));el.appendChild(o);}); }
function selectedValues(id){ return Array.from(document.getElementById(id)?.selectedOptions||[]).map(o=>o.value).filter(Boolean); }
function syncMultiSelectUI(select){ const root=select.closest('.multi-filter'); if(!root)return; const actual=[...select.options].filter(o=>o.value),selected=actual.filter(o=>o.selected),allSelected=actual.length>0&&selected.length===actual.length,label=root.querySelector('.multi-trigger-label'); if(label)label.textContent=(!selected.length||allSelected)?'Todos':(selected.length===1?selected[0].textContent:`${selected.length} selecionados`); root.querySelectorAll('.multi-option input').forEach(check=>{const option=select.options[check.dataset.optionIndex];if(option)check.checked=option.value?option.selected:(!selected.length||allSelected);}); }
function clearSiblingFilters(){ /* Os filtros são acumulativos; não limpar campos ao selecionar outro. */ }
function initMultiSelects(){ document.querySelectorAll('.filters-grid select[multiple]').forEach(select=>{let root=select.closest('.multi-filter');if(!root){root=document.createElement('div');root.className='multi-filter';select.parentNode.insertBefore(root,select);root.appendChild(select);select.classList.add('multi-native-select');const trigger=document.createElement('button');trigger.type='button';trigger.className='multi-trigger';trigger.innerHTML='<span class="multi-trigger-label">Todos</span><span class="multi-trigger-arrow">▾</span>';root.appendChild(trigger);const menu=document.createElement('div');menu.className='multi-menu';root.appendChild(menu);trigger.addEventListener('click',e=>{e.stopPropagation();document.querySelectorAll('.multi-filter.open').forEach(other=>{if(other!==root)other.classList.remove('open');});root.classList.toggle('open');});}const menu=root.querySelector('.multi-menu');menu.innerHTML='';[...select.options].forEach((option,index)=>{const row=document.createElement('label');row.className='multi-option'+(!option.value?' is-all':'');row.innerHTML=`<input type="checkbox" data-option-index="${index}"><span>${option.textContent}</span>`;const check=row.querySelector('input');check.checked=option.selected;check.addEventListener('change',()=>{if(!option.value){[...select.options].forEach(o=>o.selected=check.checked&&!!o.value);if(check.checked)clearSiblingFilters(select.id);}else{option.selected=check.checked;if(check.checked)clearSiblingFilters(select.id);const all=[...select.options].find(o=>!o.value);if(all)all.selected=false;}syncMultiSelectUI(select);select.dispatchEvent(new Event('input',{bubbles:true}));select.dispatchEvent(new Event('change',{bubbles:true}));});menu.appendChild(row);});syncMultiSelectUI(select);});document.addEventListener('click',e=>{if(!e.target.closest('.multi-filter'))document.querySelectorAll('.multi-filter.open').forEach(root=>root.classList.remove('open'));}); }

async function load(){
  const r = await fetch('Acordos.xlsx?v='+(new Date()).getTime());
  if(!r.ok) throw new Error('Não foi possível carregar Acordos.xlsx');
  const wb = XLSX.read(await r.arrayBuffer(), {type:'array'});
  const sn = wb.SheetNames.find(n=>/ACORD/i.test(n)) || wb.SheetNames[0];
  DATA = XLSX.utils.sheet_to_json(wb.Sheets[sn], {defval:''});
  buildFilters();
  window.__PFV_SYNC__?.saveToStorage();
  render();
}
function buildFilters(){
  fillSel('f_ger', DATA.map(r=>getField(r,'Gerente','GERENTE')));
  fillSel('f_coord', DATA.map(r=>getField(r,'Coordenador','COORDENADOR','Coordenação','COORDENAÇÃO','Coordenacao','COORDENACAO')));
  fillSel('f_vend', DATA.map(r=>getField(r,'Responsável','RESPONSAVEL','Vendedor','VENDEDOR')));
  fillSel('f_emp', DATA.map(r=>getField(r,'Empresa','EMPRESA')));
  fillSel('f_mes', DATA.map(r=>getField(r,'Mês','MES')));
  fillSel('f_tipo', DATA.map(r=>getField(r,'Tipo','TIPO')));
  fillSel('f_status', DATA.map(r=>getField(r,'Status','STATUS')));
  initMultiSelects();
  window.__PFV_SYNC__ = window.__PFV_SYNC__ || pfvBindFilterSync({ger:{id:'f_ger',allowCreate:true},coord:{id:'f_coord',allowCreate:true},vend:{id:'f_vend',allowCreate:true},emp:{id:'f_emp',allowCreate:true},mes:{id:'f_mes',allowCreate:true},tipo:{id:'f_tipo',allowCreate:true},status:{id:'f_status',allowCreate:true}});
  window.__PFV_SYNC__.applyFromStorage();
  document.querySelectorAll('.filters-grid select[multiple]').forEach(syncMultiSelectUI);
}
function filtered(){
  const g=id=>document.getElementById(id)?.value||'';
  const ger=selectedValues('f_ger'), coord=selectedValues('f_coord'), vend=selectedValues('f_vend'), emp=selectedValues('f_emp'), mes=selectedValues('f_mes'), tipo=selectedValues('f_tipo'), st=selectedValues('f_status');
  const cli=(g('f_cli')||'').toLowerCase().trim();
  return DATA.filter(r=>{
    if(ger.length&&!ger.includes(norm(getField(r,'Gerente','GERENTE')))) return false;
    if(coord.length&&!coord.includes(norm(getField(r,'Coordenador','COORDENADOR','Coordenação','COORDENAÇÃO','Coordenacao','COORDENACAO')))) return false;
    if(vend.length&&!vend.includes(norm(getField(r,'Responsável','RESPONSAVEL','Vendedor','VENDEDOR')))) return false;
    if(emp.length&&!emp.includes(norm(getField(r,'Empresa','EMPRESA')))) return false;
    if(mes.length&&!mes.includes(norm(getField(r,'Mês','MES')))) return false;
    if(tipo.length&&!tipo.includes(norm(getField(r,'Tipo','TIPO')))) return false;
    if(st.length&&!st.includes(norm(getField(r,'Status','STATUS')))) return false;
    if(cli){
      const c1=String(getField(r,'Cliente','CLIENTE')||'').toLowerCase();
      const c2=String(getField(r,'Cód. Fornecedor','COD. FORNECEDOR','COD FORNECEDOR')||'').toLowerCase();
      if(!c1.includes(cli) && !c2.includes(cli)) return false;
    }
    return true;
  });
}
function moneyClassByStatus(s){
  const t = up(s);
  if(t.includes('PAGO')) return 'val-pago';
  if(t.includes('A PAGAR') || t.includes('APAGAR')) return 'val-apagar';
  return '';
}

function statusBadge(s){
  const t=up(s);
  if(t.includes('PAGO')) return '<span class="badge ok">Pago</span>';
  if(t.includes('A PAGAR')||t.includes('APAGAR')) return '<span class="badge warn">A pagar</span>';
  if(!t) return '<span class="badge mid">—</span>';
  return '<span class="badge mid">'+String(s)+'</span>';
}
function render(){
 const rows=filtered();
 const total=rows.reduce((a,r)=>a+num(getField(r,'Valor','VALOR')),0);
 const pago=rows.filter(r=>up(getField(r,'Status','STATUS')).includes('PAGO')).reduce((a,r)=>a+num(getField(r,'Valor','VALOR')),0);
 document.getElementById('kpiTotal').textContent=money(total);
 document.getElementById('kpiPago').textContent=money(pago);
 document.getElementById('kpiApagar').textContent=money(total-pago);
 document.getElementById('kpiQt').textContent=rows.length.toLocaleString('pt-BR');
 document.getElementById('subInfo').textContent=rows.length.toLocaleString('pt-BR')+' acordos · '+money(total);

 const container=document.getElementById('cards');
 if(!container) return;
 container.innerHTML='';
 if(!rows.length){
   container.innerHTML='<div style="text-align:center;padding:16px;color:var(--muted);font-weight:900;border:1px dashed rgba(107,114,128,.35);border-radius:12px;background:rgba(107,114,128,.06)">Sem dados para o filtro.</div>';
   return;
 }

 const esc = (s)=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

 const groups = new Map();
 rows.forEach(r=>{
   const clifor = String(getField(r,'Clifor','CLIFOR')||'—').trim();
   const cliente = String(getField(r,'Cliente','CLIENTE')||'—').trim();
   const key = clifor+'||'+cliente;
   if(!groups.has(key)) groups.set(key, {clifor, cliente, rows:[], total:0});
   const g = groups.get(key);
   g.rows.push(r);
   g.total += num(getField(r,'Valor','VALOR'));
 });

 const ordered = Array.from(groups.values()).sort((a,b)=>b.total - a.total);
 const frag=document.createDocumentFragment();

 ordered.slice(0,400).forEach(g=>{
   const det=document.createElement('details');
   det.className='client-card';

   const sum=document.createElement('summary');
   const left=document.createElement('div');
   left.className='client-title';
   left.innerHTML = `<div class="name">${esc(g.cliente)}</div><div class="sub">Clifor: ${esc(g.clifor)}</div>`;

   const meta=document.createElement('div');
   meta.className='client-meta';
   meta.innerHTML = `<span class="pill">${g.rows.length} acordos</span><span class="pill">${money(g.total)}</span><span class="chev">▾</span>`;

   sum.appendChild(left);
   sum.appendChild(meta);
   det.appendChild(sum);

   const deals=document.createElement('div');
   deals.className='deals';

   const sorted = g.rows.slice().sort((a,b)=>(''+getField(b,'Data','DATA')).localeCompare(''+getField(a,'Data','DATA'),'pt-BR'));

   sorted.forEach(r=>{
     const acordo = getField(r,'N° Acordo','Nº Acordo','ACORDO')||'—';
     const mes = getField(r,'Mês','MES')||'—';
     const st = getField(r,'Status','STATUS')||'';
     const val = num(getField(r,'Valor','VALOR'));
     const resp = getField(r,'Responsável','RESPONSAVEL')||'—';
     const justific = String(getField(r,'JUSTIFICATIVA','Justificativa')||'').trim();

     const row=document.createElement('div');
     row.className='deal-row';

     const justBlock = justific
       ? `<details class="just"><summary>Justificativa</summary><div class="txt">${esc(justific)}</div></details>`
       : `<div class="just" style="color:var(--muted);font-weight:900">Justificativa: —</div>`;

     row.innerHTML = `
       <div class="cell"><b>#${esc(acordo)}</b> <span style="color:var(--muted);font-weight:900">· ${esc(mes)}</span></div>
       <div class="cell">${statusBadge(st)}</div>
       <div class="cell num ${moneyClassByStatus(st)}">${money(val)}</div>
       <div class="cell" title="${esc(resp)}">${esc(resp)}</div>
       <div class="meta">Mês: ${esc(mes)} · Responsável: ${esc(resp)}</div>
       ${justBlock}
     `;

     deals.appendChild(row);
   });

   det.appendChild(deals);
   frag.appendChild(det);
 });

 container.appendChild(frag);
}

(function bind(){
  document.getElementById('btnToggleFiltros')?.addEventListener('click', ()=>{
    const box=document.getElementById('filtrosBox');
    const collapsed=box.classList.toggle('collapsed');
    document.getElementById('btnToggleFiltros').textContent=collapsed?'Mostrar':'Ocultar';
  });
  document.getElementById('btnLimpar')?.addEventListener('click', ()=>{
    ['f_ger','f_coord','f_vend','f_emp','f_mes','f_tipo','f_status'].forEach(id=>{ const el=document.getElementById(id); if(el){Array.from(el.options).forEach(o=>o.selected=false);syncMultiSelectUI(el);} });
    const cli=document.getElementById('f_cli'); if(cli) cli.value='';
    try{localStorage.removeItem(PFV_FILTERS_KEY);sessionStorage.removeItem('pfv_link');}catch(e){}
    render();
  });
  document.getElementById('btnReload')?.addEventListener('click', load);
  ['f_ger','f_coord','f_vend','f_emp','f_mes','f_tipo','f_status','f_cli'].forEach(id=>{
    const el=document.getElementById(id); if(!el) return;
    el.addEventListener('input', ()=>setTimeout(render,120));
    el.addEventListener('change', ()=>setTimeout(render,120));
  });
})();

load().catch(err=>{
  console.error(err);
  const tb=document.querySelector('#cards');
  if(container) container.innerHTML=`<tr><td colspan="10" style="text-align:center;padding:16px;color:var(--warn);font-weight:900">⚠️ ${String(err.message||err)}</td></tr>`;
});
</script>

<script id="PFV_LAST_UPDATED_JSON_SCRIPT_V2">
/* ===== PFV: última atualização da base via ultima_atualizacao.json =====
   Script robusto: cria o campo no cabeçalho automaticamente e lê a chave "Acordos.xlsx" no JSON.
*/
(function(){
  const BASE_KEY = 'Acordos.xlsx';
  const JSON_URL = 'ultima_atualizacao.json';

  function ensureElement(){
    let el = document.getElementById('lastUpdated');
    if(el) return el;

    const h1 = document.querySelector('header.topbar h1');
    if(h1){
      let wrap = h1.closest('.brand-block');
      if(!wrap){
        wrap = document.createElement('div');
        wrap.className = 'brand-block';
        h1.parentNode.insertBefore(wrap, h1);
        wrap.appendChild(h1);
      }
      el = document.createElement('div');
      el.className = 'last-updated loading';
      el.id = 'lastUpdated';
      el.textContent = 'Consultando atualização da base...';
      wrap.appendChild(el);
      return el;
    }

    // Forecast tem header com logo em vez de h1.
    const logoWrap = document.querySelector('header.app-premium .header-title-wrap') || document.querySelector('header.app-premium .brand-logos');
    if(logoWrap){
      el = document.createElement('div');
      el.className = 'last-updated loading';
      el.id = 'lastUpdated';
      el.textContent = 'Consultando atualização da base...';
      if(logoWrap.parentNode) logoWrap.parentNode.insertBefore(el, logoWrap.nextSibling);
      else logoWrap.appendChild(el);
      return el;
    }

    const header = document.querySelector('header');
    if(header){
      el = document.createElement('div');
      el.className = 'last-updated loading';
      el.id = 'lastUpdated';
      el.textContent = 'Consultando atualização da base...';
      header.appendChild(el);
      return el;
    }
    return null;
  }

  function formatDate(value){
    if(value === undefined || value === null || String(value).trim() === '') return null;
    const d = new Date(value);
    if(isNaN(d.getTime()) || d.getTime() <= 0) return null;
    return d.toLocaleString('pt-BR', {
      timeZone: 'America/Sao_Paulo',
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function setText(txt, cls){
    const el = ensureElement();
    if(!el) return;
    el.classList.remove('loading','error');
    if(cls) el.classList.add(cls);
    el.textContent = txt;
  }

  async function run(){
    try{
      const resp = await fetch(JSON_URL + '?v=' + Date.now(), { cache: 'no-store' });
      if(!resp.ok) throw new Error('HTTP ' + resp.status + ' ao carregar ' + JSON_URL);
      const info = await resp.json();
      const raw = info && info[BASE_KEY];
      const formatted = formatDate(raw);
      if(!formatted) throw new Error('Data vazia ou inválida para ' + BASE_KEY);
      setText('Última atualização da base: ' + formatted, '');
    }catch(err){
      console.warn('Não foi possível obter a última atualização da base:', err);
      setText('Última atualização da base não encontrada', 'error');
    }
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', function(){ ensureElement(); run(); });
  }else{
    ensureElement();
    run();
  }
})();
</script>
